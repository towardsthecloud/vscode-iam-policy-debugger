name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration -- ${{ matrix.vscode }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: iam-debugger-${{ matrix.vscode }}
          path: |
            .vscode-test/results/
            .vscode-test/iam-policy-debugger.vsix
          if-no-files-found: error
