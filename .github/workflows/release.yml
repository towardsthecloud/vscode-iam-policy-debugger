name: Release validated extension
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: iam-policy-debugger-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    permissions:
      contents: read
      id-token: write
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: https://marketplace.visualstudio.com
            name: marketplace
          - registry: https://open-vsx.org
            name: open-vsx
    name: Publish to ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: iam-debugger-stable
          path: .vscode-test
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Publish to Visual Studio Marketplace
        if: matrix.name == 'marketplace'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath .vscode-test/iam-policy-debugger.vsix --skip-duplicate
      - uses: HaaLeo/publish-vscode-extension@v2.1.0
        if: matrix.name == 'open-vsx'
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: .vscode-test/iam-policy-debugger.vsix
          skipDuplicate: true
