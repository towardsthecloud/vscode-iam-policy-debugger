name: Release validated extension
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: iam-policy-debugger-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: https://marketplace.visualstudio.com
            token: VSCE_TOKEN
            name: marketplace
          - registry: https://open-vsx.org
            token: OPEN_VSX_TOKEN
            name: open-vsx
    name: Publish to ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: iam-debugger-stable
          path: .vscode-test
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: HaaLeo/publish-vscode-extension@v2.1.0
        with:
          pat: ${{ secrets[matrix.token] }}
          registryUrl: ${{ matrix.registry }}
          extensionFile: .vscode-test/iam-policy-debugger.vsix
          skipDuplicate: true
